<aside id="sidebar-projects" class="sidebar-panel w-[264px] shrink-0 border-r border-zinc-200 bg-zinc-50 flex flex-col max-md:fixed max-md:top-0 max-md:left-[52px] max-md:h-full max-md:z-40 max-md:shadow-xl{% if not show_projects %} hidden{% endif %}">
    <div class="flex items-center justify-between px-4 py-[14px] border-b border-zinc-200/60">
        <h2 class="text-sm font-semibold text-zinc-900 tracking-tight">Projects</h2>
        <button class="w-6 h-6 flex items-center justify-center rounded text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        </button>
    </div>
    <div class="px-3 py-3">
        <div class="relative">
            <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-zinc-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Search projects..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-zinc-200/50 border border-zinc-200 rounded-md text-zinc-700 placeholder-zinc-400 focus:outline-none focus:ring-zinc-300/20 focus:border-zinc-500">
        </div>
    </div>
    {% if projects %}
    <div class="flex-1 overflow-y-auto">
        {% for project in projects %}
            <div class="border-l-2 border-transparent hover:bg-zinc-100 px-4 py-3 cursor-pointer" hx-get="{% url 'core:project_detail' pk=project.id %}" hx-target="#mainContent">
                <div class="flex items-center gap-3">
                    {% with initial=project|stringformat:'s'|first|upper %}
                    <div class="w-8 h-8 rounded-md bg-zinc-800 flex items-center justify-center flex-shrink-0"><span class="text-xs font-semibold text-white">{{ initial }}</span></div>
                    {% endwith %}
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-semibold text-zinc-900 truncate">{{ project }}</div>
                        <div class="text-[11px] text-zinc-500 truncate">{{ project.title }}</div>
                    </div>
                    <span class="text-[11px] text-zinc-400 flex-shrink-0">—</span>
                </div>
                <div class="flex gap-1 mt-2 ml-11"></div>
            </div>
        {% endfor %}
    </div>
    {% endif %}
</aside>
