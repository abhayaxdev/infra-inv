<div class="max-w-4xl mx-auto px-4 md:px-8 py-6">

    <!-- Header -->
    <div class="flex items-start justify-between mb-6">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <svg class="w-5 h-5 text-zinc-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <h1 class="text-xl font-bold text-zinc-900 tracking-tight">{{ project.title }}</h1>
            </div>
            <p class="text-sm text-zinc-500">
                {% if project.description %}
                    {{ project.description }}
                {% endif %}
            </p>
        </div>
    </div>

    <!-- Meta bar -->
    <div class="flex items-center gap-6 mb-6 text-xs text-zinc-500">
        <div class="flex items-center gap-1.5">
            <svg class="w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
            <span class="font-medium text-zinc-700">2d ago</span>
            <span class="text-zinc-400">Last Updated</span>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="text-2xl font-bold text-zinc-800">4</div>
            <div class="text-xs text-zinc-500 mt-0.5">Total Deployments</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500"></span><span class="text-2xl font-bold text-zinc-800">2</span></div>
            <div class="text-xs text-zinc-500 mt-0.5">Active</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-yellow-500"></span><span class="text-2xl font-bold text-zinc-800">1</span></div>
            <div class="text-xs text-zinc-500 mt-0.5">Maintenance</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-zinc-400"></span><span class="text-2xl font-bold text-zinc-800">1</span></div>
            <div class="text-xs text-zinc-500 mt-0.5">Inactive</div>
        </div>
    </div>

        <!-- Tabs -->
    <div class="flex items-center gap-1 mb-6" id="envTabs">
        <button class="env-tab px-4 py-2 text-xs font-medium rounded-lg bg-black text-white transition-colors" data-env="all" onclick="filterEnvs(this)">All</button>
        {% for env in deploy_envs %}
        <button class="env-tab px-4 py-2 text-xs font-medium rounded-lg border border-zinc-200 text-zinc-600 hover:bg-zinc-200/70 transition-colors" data-env="{{ env.0 }}" onclick="filterEnvs(this)">
            {{ env.1|upper }}
        </button>
        {% endfor %}
    </div>

    {% include "partials/_deploys.html" %}
