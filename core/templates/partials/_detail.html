<div class="max-w-4xl mx-auto px-8 py-6">

    <!-- Header -->
    <div class="flex items-start justify-between mb-6">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <svg class="w-5 h-5 text-[#80c0ff]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <h1 class="text-xl font-bold text-zinc-900 tracking-tight">{{ project.title }}</h1>
            </div>
            <p class="text-sm text-zinc-500">
                {% if project.description %}
                    {{ project.description }}
                {% endif %}
            </p>
        </div>
        <div class="flex items-center gap-2">
            <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-[#005ab3] bg-[#80c0ff]/15 border border-[#80c0ff]/25 rounded-md hover:bg-[#80c0ff]/25 transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke-linecap="round"/></svg>Open in New Tab</button>
            <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-[#005ab3] rounded-md hover:bg-[#003f7d] transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke-linecap="round"/></svg>Edit Project</button>
            <div class="relative">
                <button class="inline-flex items-center justify-center w-8 h-8 text-zinc-400 border border-zinc-200 rounded-md hover:bg-zinc-200/70 hover:text-zinc-600">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Meta bar -->
    <div class="flex items-center gap-6 mb-6 text-xs text-zinc-500">
        <div class="flex items-center gap-1.5">
            <svg class="w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            {% if project.github_addr %}
                <a href="{{ project.github_addr }}" target="_blank" class="font-medium text-[#005ab3] hover:text-[#003f7d]">
                    {{ project.github_addr }}
                </a>
                {% else %}
                <span class="font-medium text-zinc-700">
                    --
                </span>
                {% endif %}
        </div>
        <div class="flex items-center gap-1.5">
            <svg class="w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
            <span class="font-medium text-zinc-700">2d ago</span>
            <span class="text-zinc-400">Last Updated</span>
        </div>
    </div>

    <div class="grid grid-cols-4 gap-3 mb-8">
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="text-2xl font-bold text-[#005ab3]">4</div>
            <div class="text-xs text-zinc-500 mt-0.5">Total Environments</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500"></span><span class="text-2xl font-bold text-[#005ab3]">2</span></div>
            <div class="text-xs text-zinc-500 mt-0.5">Active</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-yellow-500"></span><span class="text-2xl font-bold text-[#005ab3]">1</span></div>
            <div class="text-xs text-zinc-500 mt-0.5">Maintenance</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-lg p-4">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-zinc-400"></span><span class="text-2xl font-bold text-[#005ab3]">1</span></div>
            <div class="text-xs text-zinc-500 mt-0.5">Inactive</div>
        </div>
    </div>

    {% include "partials/_deploys.html" %}
