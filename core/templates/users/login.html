<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraInv | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-zinc-50 text-zinc-900 min-h-screen flex flex-col" style="font-feature-settings: 'tnum' 1, 'cv01' 1, 'cv03' 1, 'cv04' 1, 'cv10' 1;">

    <header class="flex items-center px-6 py-4 border-b border-zinc-200/60">
        <a href="/" class="text-sm font-semibold text-zinc-900 tracking-tight">InfraInv</a>
    </header>

    <main class="flex-1 flex items-center justify-center px-4">
        <div class="w-full max-w-sm">
            <h2 class="text-xl font-bold text-zinc-900 mb-6 text-center tracking-tight">Sign In</h2>

            {% if form.errors %}
            <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 mb-6">
                Invalid email or password. Please try again.
            </div>
            {% endif %}

            {% if messages %}
            {% for message in messages %}
            <div class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700 mb-6">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label for="{{ form.username.id_for_label }}" class="block text-xs font-medium text-zinc-500 mb-1.5">Email</label>
                    <input type="email" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg bg-white text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-200 focus:border-zinc-400" placeholder="you@example.com" required autofocus>
                </div>
                <div>
                    <label for="{{ form.password.id_for_label }}" class="block text-xs font-medium text-zinc-500 mb-1.5">Password</label>
                    <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" class="w-full px-3 py-2 text-sm border border-zinc-300 rounded-lg bg-white text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-200 focus:border-zinc-400" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full py-2.5 text-sm font-medium text-white bg-zinc-800 rounded-lg hover:bg-zinc-700 transition-colors shadow-sm">
                    Sign In
                </button>
            </form>
        </div>
    </main>

</body>
</html>
