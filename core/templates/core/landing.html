<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraInv — Infrastructure Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --fg: #fafafa;
            --muted: #888;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #fafafa;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .line-art {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .line-art svg {
            position: absolute;
            top: 28%;
            right: 8%;
        }

        main {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 700px;
            padding: 0 32px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.15);
            margin-bottom: 32px;
        }
        .badge-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #818cf8;
        }

        h1 {
            font-size: clamp(42px, 6.5vw, 68px);
            font-weight: 700;
            letter-spacing: -0.045em;
            line-height: 1.04;
            margin-bottom: 20px;
            color: var(--fg);
        }

        .subtitle {
            color: var(--muted);
            font-size: 18px;
            line-height: 1.65;
            max-width: 460px;
            margin: 0 auto 48px;
            letter-spacing: -0.01em;
        }

        .pills {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .pill {
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.005em;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            transition: border-color 0.2s, color 0.2s;
            cursor: default;
        }
        .pill:hover {
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--fg);
        }
    </style>
</head>
<body>
    <main>
        <div class="badge">
            <span class="badge-dot"></span>
            Coming Soon
        </div>

        <h1>Infrastructure Inventory</h1>

        <p class="subtitle">
            Deployment intelligence across all environments — for every stakeholder.
            No middlemen, no guesswork.
        </p>

        <div class="pills">
            <span class="pill">Dev</span>
            <span class="pill">Staging</span>
            <span class="pill">UAT</span>
            <span class="pill">Production</span>
        </div>
    </main>
</body>
</html>
