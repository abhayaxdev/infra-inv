<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraInv</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0b;
            --surface: #111113;
            --text: #ededef;
            --text-muted: #6c6c76;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.15);
            --border: rgba(255, 255, 255, 0.06);
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 30%, transparent 70%);
        }

        .gradient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
        }
        .gradient-orb--1 {
            width: 600px; height: 600px;
            background: var(--accent-glow);
            top: -200px; left: -100px;
            animation: float 8s ease-in-out infinite;
        }
        .gradient-orb--2 {
            width: 400px; height: 400px;
            background: rgba(147, 51, 234, 0.08);
            bottom: -100px; right: -50px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.1); }
        }

        .card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 64px 56px;
            text-align: center;
            max-width: 520px;
            width: 90%;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 2px 8px rgba(0, 0, 0, 0.4),
                0 32px 64px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 24px var(--accent-glow);
        }
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .tag {
            display: inline-block;
            background: var(--accent-glow);
            color: #a78bfa;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 12px;
        }
        h1 span { color: var(--accent); }

        p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 36px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 0;
        }
        .feature {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
        }
        .feature-icon {
            font-size: 20px;
            margin-bottom: 6px;
        }
        .feature-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .footer-note {
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .card { padding: 40px 28px; }
            h1 { font-size: 28px; }
            .features { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .feature { padding: 12px 8px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="gradient-orb gradient-orb--1"></div>
    <div class="gradient-orb gradient-orb--2"></div>

    <main class="card">
        <div class="logo">
            <div class="logo-icon">&#9200;</div>
            <span class="logo-text">InfraInv</span>
        </div>

        <div class="tag">Coming Soon</div>

        <h1>Infrastructure<br><span>Inventory</span></h1>

        <p>
            Real-time deployment intelligence for every stakeholder.
            No middlemen, no guesswork — just clarity across all your environments.
        </p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">&#128736;</div>
                <div class="feature-label">DEV</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#128230;</div>
                <div class="feature-label">STAGING</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#128737;</div>
                <div class="feature-label">PROD</div>
            </div>
        </div>

        <div class="footer-note">We're building something great. Stay tuned.</div>
    </main>
</body>
</html>
