<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InfraInv{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased text-zinc-900 bg-zinc-50" style="font-feature-settings: 'tnum' 1, 'cv01' 1, 'cv03' 1, 'cv04' 1, 'cv10' 1;">

<div class="flex h-screen overflow-hidden">

<!-- LEFT ICON RAIL -->
<aside class="w-[52px] flex-shrink-0 flex flex-col items-center py-4 bg-zinc-100 border-r border-zinc-200">
    <a href="{% url 'core:landing' %}" class="mb-8" title="Home">
        <svg class="w-6 h-6 text-zinc-700" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L24 22H0L12 2z"/></svg>
    </a>
    <nav class="flex-1 flex flex-col items-center gap-5">
        <button onclick="switchSidebar('projects')" data-sidebar="projects" class="icon-rail-btn w-8 h-8 flex items-center justify-center rounded-md bg-zinc-800 text-white" title="Projects">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </button>
        <button class="icon-rail-btn w-8 h-8 flex items-center justify-center rounded-md text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100" title="Environments">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-rail-btn w-8 h-8 flex items-center justify-center rounded-md text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100" title="Security">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        {% if user.is_superuser %}
        <button onclick="switchSidebar('users')" data-sidebar="users" class="icon-rail-btn w-8 h-8 flex items-center justify-center rounded-md text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100" title="Users">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke-linecap="round"/></svg>
        </button>
        {% endif %}
        <button class="icon-rail-btn w-8 h-8 flex items-center justify-center rounded-md text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100" title="Settings">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 8.4a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke-linecap="round"/></svg>
        </button>
    </nav>
    <div class="flex flex-col items-center gap-5 mt-auto pb-2">
        <button class="w-8 h-8 flex items-center justify-center rounded-md text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100" title="Help">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>
        </button>
        <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-8 h-8 flex items-center justify-center rounded-md text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100" title="Log Out">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </form>
        <div class="w-7 h-7 rounded-full bg-zinc-100 flex items-center justify-center text-[10px] font-semibold text-zinc-700">{{ user.email|slice:":2"|upper }}</div>
    </div>
</aside>

<!-- SIDEBAR PANELS -->
<div id="sidebar-backdrop" class="hidden md:hidden fixed inset-0 bg-black/20 z-30" onclick="closeAllSidebars()"></div>
{% block sidebar %}{% endblock %}

<!-- MAIN CONTENT -->
<main class="flex-1 overflow-y-auto bg-zinc-50" id="mainContent">
    {% if messages %}
    {% for message in messages %}
    <div class="flex items-center justify-between rounded-lg border px-4 py-3 text-sm m-4
        {% if message.level_tag == 'error' %}border-red-200 bg-red-50 text-red-700
        {% elif message.level_tag == 'warning' %}border-yellow-200 bg-yellow-50 text-yellow-700
        {% elif message.level_tag == 'success' %}border-green-200 bg-green-50 text-green-700
        {% else %}border-blue-200 bg-blue-50 text-blue-700{% endif %}">
        <span>{{ message }}</span>
        <button onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100 ml-3 flex-shrink-0">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
    </div>
    {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-max bg-zinc-800 text-white text-xs px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none z-50"></div>

<script>
function switchSidebar(name) {
    var target = document.getElementById('sidebar-' + name);
    if (!target) return;

    var isOpen = !target.classList.contains('hidden');

    closeAllSidebars();
    unhighlightAll();

    if (isOpen) return;

    target.classList.remove('hidden');
    highlightSidebarBtn(name);
    var backdrop = document.getElementById('sidebar-backdrop');
    if (backdrop && window.innerWidth < 768) backdrop.classList.remove('hidden');
}

function closeAllSidebars() {
    document.querySelectorAll('[id^="sidebar-"]').forEach(function(s) {
        s.classList.add('hidden');
    });
    var backdrop = document.getElementById('sidebar-backdrop');
    if (backdrop) backdrop.classList.add('hidden');
}

function unhighlightAll() {
    document.querySelectorAll('.icon-rail-btn[data-sidebar]').forEach(function(b) {
        b.classList.remove('bg-zinc-800', 'text-white');
        b.classList.add('text-zinc-400');
    });
}

function highlightSidebarBtn(name) {
    var btn = document.querySelector('.icon-rail-btn[data-sidebar="' + name + '"]');
    if (btn) {
        btn.classList.add('bg-zinc-800', 'text-white');
        btn.classList.remove('text-zinc-400');
    }
}
</script>

</body>
</html>
